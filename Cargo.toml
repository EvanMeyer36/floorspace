[workspace]
resolver = "2"
members = ["core", "cli", "desktop/src-tauri"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/EvanMeyer36/mac-cleaner"

[workspace.dependencies]
cleaner-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
