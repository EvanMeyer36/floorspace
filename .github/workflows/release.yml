name: Release

# Push a tag like v2.0.0 to build every platform and publish a GitHub release.
# Release notes come from docs/release-notes/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (native app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal app, installer (.dmg) and portable (.zip)
        working-directory: macos
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: macos/dist/Floorspace-*
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build installers
        working-directory: desktop
        run: |
          npm ci
          npx tauri build

      - name: Collect release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) "out/Floorspace-$v-windows-setup.exe"
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1) "out/Floorspace-$v-windows.msi"
          # Portable: the app is one self-contained .exe (it uses the WebView2 runtime built into Windows 10/11).
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/Floorspace.exe portable/Floorspace.exe
          Compress-Archive -Path portable/Floorspace.exe -DestinationPath "out/Floorspace-$v-windows-portable.zip"

      - name: Collect release files (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp target/release/bundle/deb/*.deb "out/Floorspace-$v-linux-amd64.deb"
          cp target/release/bundle/rpm/*.rpm "out/Floorspace-$v-linux-x86_64.rpm"
          cp target/release/bundle/appimage/*.AppImage "out/Floorspace-$v-linux-x86_64-portable.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum Floorspace-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" files/* --title "Floorspace ${GITHUB_REF_NAME#v}" --notes-file "$notes" --verify-tag
